# Builds the site and deploys it to Cloudflare Pages on every push to main,
# and when the feed job (feed.yml) commits new items (a push by a workflow
# does not start other workflows, so feed.yml calls this one).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Optional repository variables: PUBLIC_MAPILLARY_TOKEN, PUBLIC_STREET_LEVEL_PROVIDER, PUBLIC_GOOGLE_MAPS_KEY
# PUBLIC_TURNSTILE_SITE_KEY (the reader form at /send/ stays closed without it)
# Pages bindings and secrets for functions/ are in wrangler.toml.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# One deploy at a time; a newer one replaces a queued one.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A called run must build the feed commit, not the commit that started the schedule.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run validate
      # The photo credit labels (scripts/stamp-photos.mjs) are drawn in DejaVu Sans.
      - name: Font for photo credit labels
        run: fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - run: npm run build
        env:
          PUBLIC_MAPILLARY_TOKEN: ${{ vars.PUBLIC_MAPILLARY_TOKEN }}
          PUBLIC_STREET_LEVEL_PROVIDER: ${{ vars.PUBLIC_STREET_LEVEL_PROVIDER }}
          PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      # The sitemap that is live now, so IndexNow can send only the pages that change in this deploy.
      - name: Save the live sitemap
        continue-on-error: true
        run: curl -fsS --max-time 30 -o "$RUNNER_TEMP/sitemap-before.xml" https://www.mumbaimetrotracker.com/sitemap.xml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=line12-tracker --branch=main
      # Tell Bing and the other IndexNow engines which pages are new or changed (scripts/indexnow.mjs).
      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs --before "$RUNNER_TEMP/sitemap-before.xml"
